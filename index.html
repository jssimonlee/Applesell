<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174e3c" />
    <title>AppleSell · 사과 주문서 정리</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>🍎 사과 주문서 정리</h1>
      <p>네이버폼 응답 엑셀을 주문서로 변환합니다.</p>
    </header>
    <main class="container">
      <div
        id="file-message"
        class="file-message"
        role="status"
        aria-live="polite"
        hidden
      ></div>
      <section id="upload-section" class="card">
        <h2>주문 결과 업로드</h2>
        <div id="dropzone" class="dropzone">
          <div class="upload-icon" aria-hidden="true">↑</div>
          <p class="dz-main">엑셀 파일을 여기로 끌어다 놓으세요</p>
          <button id="btn-select" class="btn primary" type="button">
            파일 선택
          </button>
          <input type="file" id="file-input" accept=".xlsx,.xls" hidden />
          <p class="file-types">지원 형식: .xlsx, .xls</p>
        </div>
      </section>
      <section id="preview-section" hidden>
        <div class="preview-toolbar">
          <div class="toolbar-row">
            <strong id="meta-file">—</strong>
            <button id="btn-reset" class="btn secondary" type="button">
              다른 파일
            </button>
          </div>
          <div class="toolbar-row">
            <span id="selection-summary" aria-live="polite"></span>
            <button id="btn-download" class="btn primary" type="button">
              수정본 다운로드
            </button>
          </div>
        </div>
        <div
          class="table-wrap"
          tabindex="0"
          role="region"
          aria-label="주문서 미리보기"
        >
          <table id="preview-table">
            <thead>
              <tr>
                <th scope="col">순번</th>
                <th scope="col">사과상품선택</th>
                <th scope="col">사과 수량선택</th>
                <th scope="col">주문자이름</th>
                <th scope="col">연락처</th>
                <th scope="col">배송지주소</th>
              </tr>
            </thead>
            <tbody id="preview-tbody"></tbody>
          </table>
        </div>
      </section>
      <footer class="site-footer">파일은 서버로 전송되지 않습니다.</footer>
    </main>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
